name: Oracle Ampere 24/7 Capacity Catcher

on:
  schedule:
    # Failsafe restart trigger every 5 hours
    - cron: '0 */5 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub web UI

concurrency:
  group: oci-catcher-singleton
  cancel-in-progress: false

permissions:
  actions: write
  issues: write
  contents: write

jobs:
  continuous-provisioner:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max runner lifetime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 24/7 Continuous Loop
        env:
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_KEY_CONTENT: ${{ secrets.OCI_KEY_CONTENT }}
          OCI_SSH_PUBKEY: ${{ secrets.OCI_SSH_PUBKEY }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py
